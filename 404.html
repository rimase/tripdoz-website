<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Continue in Tripdoz</title>
<style>
body{margin:0;background:#f7f8fa;color:#1e2d4a;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}
main{box-sizing:border-box;width:100%;max-width:420px;padding:32px;text-align:center}
h1{font-size:28px;margin:0 0 12px}
p{line-height:1.6;color:#536174;margin:0 0 24px}
.button{display:block;box-sizing:border-box;width:100%;background:#1e2d4a;color:#fff;text-decoration:none;border-radius:12px;padding:15px;margin:12px 0;font-weight:600}
.button.secondary{background:#fff;color:#1e2d4a;border:1px solid #ccd2dc}.button{display:flex;align-items:center;justify-content:center;gap:10px}.button svg{width:22px;height:22px;flex:none}
</style>
</head>
<body><main>
<h1>Continue in Tripdoz</h1>
<p id="description">Open this link in Tripdoz or get the app for your phone.</p>
<a class="button" id="open" href="#">Open Tripdoz</a>
<a class="button secondary" href="https://play.google.com/store/apps/details?id=com.tripdoz.app"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3 2.6v18.8L13.3 12z"/><path fill="#4285F4" d="m3 2.6 11.7 7.1L18.3 12 14.7 14.3 3 21.4 13.3 12z"/><path fill="#FBBC04" d="m14.7 9.7 4.4 2.7c1.2.7 1.2 1.7 0 2.4l-4.4 2.7-4.1-5.5z"/><path fill="#EA4335" d="m3 21.4 11.7-7.1 3.6 2.2-12.4 7.4c-1.3.7-2.9-.1-2.9-2.5z"/></svg><span>Get it on Google Play</span></a>
<a class="button secondary" href="https://apps.apple.com/us/search?term=Tripdoz"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M17.1 12.7c0-2 1.6-3 1.7-3.1-1-1.5-2.5-1.7-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.8-2.7-.8-1.4 0-2.8.8-3.5 2-1.5 2.6-.4 6.4 1 8.5.7 1 1.5 2.1 2.6 2.1 1 0 1.4-.7 2.7-.7s1.6.7 2.7.7 1.8-1 2.5-2c.8-1.1 1.1-2.2 1.1-2.3-2.2-.8-2-3.3-2-3.5ZM14.9 6.6c.6-.8 1-1.8.9-2.8-1 .1-2.1.7-2.8 1.5-.6.7-1.1 1.7-1 2.7 1.1.1 2.2-.6 2.9-1.4Z"/></svg><span>Get it on App Store</span></a>
</main>
<script>
(function(){
var match=location.pathname.match(/^\/(invite|place)\/([^/]+)\/?$/);
if(!match){location.replace('/');return;}
var kind=match[1],id=match[2];
document.getElementById('description').textContent=kind==='invite'
?'Open your travel plan invitation in Tripdoz, or install the app to continue.'
:'Open this place in Tripdoz, or install the app to explore.';
document.getElementById('open').href='tripdoz://'+kind+'/'+encodeURIComponent(decodeURIComponent(id));
})();
</script>
</body></html>
