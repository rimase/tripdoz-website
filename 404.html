<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Open in Tripdoz</title>
<style>body{margin:0;background:#f7f8fa;color:#1e2d4a;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}main{max-width:420px;padding:32px;text-align:center}h1{font-size:28px}p{line-height:1.6;color:#536174}.button{display:block;background:#1e2d4a;color:#fff;text-decoration:none;border-radius:12px;padding:15px;margin:22px 0;font-weight:600}.secondary{color:#1e2d4a}</style>
</head><body><main><h1>Continue in Tripdoz</h1><p id="description">Discover places and travel plans across Egypt.</p><a class="button" id="open" href="/">Open Tripdoz</a><a class="secondary" id="install" href="#" style="display:none">Get Tripdoz</a></main>
<script>
(function(){
var path=location.pathname;
var match=path.match(/^\/(invite|place)\/([^/]+)\/?$/);
if(!match){location.replace('/');return;}
var kind=match[1],id=match[2];
document.getElementById('description').textContent=kind==='invite'?'You have been invited to a travel plan. Open Tripdoz to sign in and join.':'Open this place in Tripdoz to see photos, reviews and visitor information.';
document.getElementById('open').href='tripdoz://'+kind+'/'+id;
var ua=navigator.userAgent||'';
var android=/Android/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua);
var install=document.getElementById('install');
if(android){
  install.href='https://play.google.com/store/apps/details?id=com.tripdoz.app';
  install.textContent='Get Tripdoz on Google Play';
  install.style.display='block';
}else if(ios){
  install.href='https://apps.apple.com/us/search?term=Tripdoz';
  install.textContent='Find Tripdoz on the App Store';
  install.style.display='block';
}
})();
</script></body></html>
